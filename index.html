<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dali University Finder - International Students Guide</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            animation: fadeIn 0.8s ease-out;
        }

        .panel {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            min-height: 500px;
        }

        .panel h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .country-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            flex: 1;
            overflow-y: auto;
        }

        .country-btn, .university-btn {
            padding: 12px 15px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 0.95em;
        }

        .country-btn:hover, .university-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .country-btn.active, .university-btn.active {
            background: #667eea;
            color: white;
        }

        .university-list {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .university-item {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            background: white;
            color: #333;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-align: left;
            font-size: 0.95em;
        }

        .university-item:hover {
            background: #f5f5f5;
            border-color: #667eea;
            transform: translateX(5px);
        }

        .university-item.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .difficulty-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-top: 5px;
        }

        .difficulty-easy {
            background: #d4edda;
            color: #155724;
        }

        .difficulty-medium {
            background: #fff3cd;
            color: #856404;
        }

        .difficulty-hard {
            background: #f8d7da;
            color: #721c24;
        }

        .details-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .detail-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .detail-section h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .detail-section p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 5px;
        }

        .expense-list {
            list-style: none;
        }

        .expense-list li {
            color: #555;
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }

        .expense-list li:before {
            content: "💰";
            position: absolute;
            left: 0;
        }

        .info-list {
            list-style: none;
        }

        .info-list li {
            color: #555;
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }

        .info-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }

        .placeholder {
            text-align: center;
            color: #999;
            padding: 40px 20px;
        }

        .placeholder-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @media (max-width: 1024px) {
            .content {
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }

            .panel {
                min-height: 400px;
            }
        }

        @media (max-width: 768px) {
            .content {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 1.8em;
            }

            .country-grid {
                grid-template-columns: 1fr;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎓 University Finder</h1>
            <p>Discover the best universities for international students worldwide</p>
        </header>

        <div class="content">
            <!-- Countries Panel -->
            <div class="panel">
                <h2>Step 1: Choose Country</h2>
                <div class="country-grid" id="countriesList">
                    <div class="placeholder">
                        <div class="placeholder-icon">🌍</div>
                        <p>Loading countries...</p>
                    </div>
                </div>
            </div>

            <!-- Universities Panel -->
            <div class="panel">
                <h2>Step 2: Select University</h2>
                <div id="universitiesPanel">
                    <div class="placeholder">
                        <div class="placeholder-icon">🏫</div>
                        <p>Choose a country first</p>
                    </div>
                </div>
            </div>

            <!-- Details Panel -->
            <div class="panel">
                <h2>Step 3: University Details</h2>
                <div id="detailsPanel">
                    <div class="placeholder">
                        <div class="placeholder-icon">📋</div>
                        <p>Select a university to view details</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
